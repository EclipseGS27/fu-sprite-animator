<!doctype html>
<html><head><meta charset="utf-8"><title>Foundry mock</title>
<link rel="stylesheet" href="../../styles/studio.css">
<style>html,body{margin:0;height:100%;background:#20242e}#board{position:fixed;left:0;top:0}</style>
</head>
<body>
<canvas id="board" width="900" height="500"></canvas>
<script src="../../node_modules/pixi.js/dist/pixi.min.js"></script>
<script src="foundry-mock.js"></script>
<script>
	window.canvas.app = new PIXI.Application({ view: document.getElementById('board'), width: 900, height: 500, backgroundColor: 0x2b3245 });
</script>
<script type="module">
	await import('../../dist/fu-sprite-animator.mjs');
	window.mockReady = true;
</script>
</body></html>
