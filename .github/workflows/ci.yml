name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: dist/ is up to date with src/
        run: npm run build && git diff --exit-code -- dist/
      - name: Browser tests (headless Chromium, PixiJS 7)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run test:render
          npm run test:ui
          node test/render/integration.mjs
